[project]
name = "skillscan"
version = "0.1.0"
description = "Static security scanner for AI-agent skills and MCP servers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Topicspot"}]
dependencies = ["typer==0.12.5", "rich==13.9.4", "pyyaml==6.0.2", "click==8.1.7"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[project.scripts]
skillscan = "skillscan.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
