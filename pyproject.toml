[project]
name = "skillfrisk"
version = "0.2.0"
description = "Static security scanner for AI-agent skills and MCP servers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Topicspot"}]
dependencies = ["typer>=0.16", "rich>=13.9", "pyyaml>=6.0.2", "click>=8.3.3"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14",
    "mypy>=1.14",
    "types-PyYAML",
    "vulture>=2.13",
    "pip-audit>=2.7",
]

[project.scripts]
skillfrisk = "skillfrisk.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/corpus"]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "ARG", "PTH", "RUF"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/skillfrisk"]

[tool.mypy]
strict = true
files = ["src"]

[tool.vulture]
paths = ["src"]
min_confidence = 80
