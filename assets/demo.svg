<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-label="skillscan terminal demo">
  <rect width="980" height="430" rx="18" fill="#0f172a"/>
  <rect x="20" y="20" width="940" height="390" rx="14" fill="#111827" stroke="#334155"/>
  <circle cx="48" cy="48" r="7" fill="#ef4444"/><circle cx="72" cy="48" r="7" fill="#f59e0b"/><circle cx="96" cy="48" r="7" fill="#22c55e"/>
  <text x="40" y="90" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$ pipx install git+https://github.com/Topicspot/skillscan.git</text>
  <text x="40" y="125" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$ skillscan scan suspicious-skill --json</text>
  <text x="40" y="165" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">risk_score: 100/100   findings: 10   exit_code: 2</text>
  <text x="40" y="210" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">CRITICAL  REMOTE_CODE_EXEC   SKILL.md:7   curl ... | bash</text>
  <text x="40" y="245" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">HIGH      PROMPT_INJECTION  SKILL.md:6   Ignore previous instructions</text>
  <text x="40" y="280" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">HIGH      SECRET_ACCESS     run.py:6      os.environ.get("API_KEY")</text>
  <text x="40" y="335" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Use before installing unknown AI-agent skills or MCP servers.</text>
</svg>
