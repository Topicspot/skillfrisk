name: "skillfrisk"
description: "Static security scan for AI-agent skills and MCP servers (prompt injection, secret access, RCE patterns)."
branding:
  icon: "shield"
  color: "red"
inputs:
  path:
    description: "Path to scan"
    required: false
    default: "."
  args:
    description: "Extra CLI arguments (e.g. --json)"
    required: false
    default: ""
  sarif:
    description: "Write a SARIF report to this path (leave empty to disable)."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Run skillfrisk
      shell: bash
      run: |
        SARIF_ARG=()
        if [ -n "${{ inputs.sarif }}" ]; then
          mkdir -p "$(dirname "${{ inputs.sarif }}")"
          SARIF_ARG=(--sarif "${{ inputs.sarif }}")
        fi
        uvx --from "git+https://github.com/Topicspot/skillfrisk" skillfrisk scan "${{ inputs.path }}" "${SARIF_ARG[@]}" ${{ inputs.args }}
